<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eugene Rings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root {
  --bg: #FCFCFD; --surface: #FFFFFF; --sunk: #F5F6F8; --ink: #24272D; --muted: #646B78; --line: #E7E9ED; --track: #EEF0F3;
  --brand: #CC2A31; --brand-ink: #FFFFFF; --brand-soft: #FCEDEE; --brand-deep: #A51F26; --brand-hi: #EA5A60; --silver: #8E9AA4; --today: #2B2F36;
  --up: #D93A42; --down: #2F6BD0; --warn: #9A5B00; --warn-soft: #FFF5E3; --ok: #2A7F60; --ok-soft: #E8F5EF;
  --glow1: rgba(204, 42, 49, .06); --glow2: rgba(142, 154, 164, .05);
  --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 22px; --shadow: 0 12px 32px rgba(38, 43, 51, .10);
  --f: "Pretendard Variable", Pretendard, "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18191D; --surface: #1F2125; --sunk: #26282D; --ink: #ECEDF0; --muted: #A3A9B3; --line: #32353C; --track: #2D3036;
    --brand: #F0555B; --brand-ink: #FFFFFF; --brand-soft: #3A1F23; --brand-deep: #C9353C; --brand-hi: #FF7F84; --silver: #A6B0BA; --today: #ECEDF0;
    --up: #F26B73; --down: #75A6EF; --warn: #F0B45A; --warn-soft: #33291C; --ok: #6CCBA5; --ok-soft: #17302A;
    --glow1: rgba(240, 85, 91, .09); --glow2: rgba(166, 176, 186, .05); --shadow: 0 14px 40px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18191D; --surface: #1F2125; --sunk: #26282D; --ink: #ECEDF0; --muted: #A3A9B3; --line: #32353C; --track: #2D3036;
  --brand: #F0555B; --brand-ink: #FFFFFF; --brand-soft: #3A1F23; --brand-deep: #C9353C; --brand-hi: #FF7F84; --silver: #A6B0BA; --today: #ECEDF0;
  --up: #F26B73; --down: #75A6EF; --warn: #F0B45A; --warn-soft: #33291C; --ok: #6CCBA5; --ok-soft: #17302A;
  --glow1: rgba(240, 85, 91, .09); --glow2: rgba(166, 176, 186, .05); --shadow: 0 14px 40px rgba(0, 0, 0, .45); color-scheme: dark;
}
html { scroll-padding-top: calc(80px + env(safe-area-inset-top, 0px)); height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word; overflow-x: clip; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(60% 50% at 50% 42%, var(--glow1), transparent 100%), radial-gradient(95% 80% at 50% 50%, var(--glow2), transparent 100%); transition: opacity .6s; }
body.inside::after { opacity: .3; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }

/* 상단 */
.top { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 9; height: 64px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); transition: background .3s, border-color .3s; border-bottom: 1px solid transparent; }
.top { background: var(--bg); }
.top::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, var(--brand) 0 50%, var(--silver) 100%); opacity: .7; }

.tr { justify-self: end; display: inline-flex; align-items: center; gap: 6px; }
@media (max-width: 720px) { .tr .aist { display: none; } }
@media (min-width: 721px) { .fine .aist, .fine .aist + .sep { display: none; } }
body.inside .top, body.scrolled .top { background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); border-bottom-color: var(--line); }
.logo { justify-self: start; display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; }
.logo .ci { display: inline-flex; padding: 2px 0; }
.logo .ci img { height: 18px; display: block; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo .ci img { filter: brightness(1.35) saturate(1.1); } }
:root[data-theme="dark"] .logo .ci img { filter: brightness(1.35) saturate(1.1); }
.logo b { font-size: 15px; font-weight: 700; letter-spacing: -.015em; }
.logo b::after { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--brand); margin-left: 3px; vertical-align: 7px; }
.demo-tag { justify-self: end; font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
@media (max-width: 520px) { .logo b { display: none; } .demo-tag { font-size: 10.5px; padding: 2px 8px; } .top { grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; } .rail { justify-self: center; } .rail .link { width: 14px; } }

/* 링 레일 (FR-02) */
.rail { display: flex; align-items: center; gap: 0; opacity: 0; transform: translateY(-8px) scale(.9); transition: opacity .35s .15s, transform .45s .1s cubic-bezier(.2, .8, .2, 1); pointer-events: none; }
body.inside .rail { opacity: 1; transform: none; pointer-events: auto; }
.rail button { border: 0; background: none; padding: 4px; display: grid; justify-items: center; gap: 0; border-radius: 12px; }
.rail button svg { width: 30px; height: 30px; transition: transform .3s; }
.rail button span { font-size: 10.5px; color: var(--muted); line-height: 1.2; }
.rail button[aria-current="true"] svg { transform: scale(1.22); }
.rail button[aria-current="true"] span { color: var(--ink); font-weight: 600; }
.rail .link { width: 26px; height: 2px; background: var(--track); border-radius: 1px; position: relative; overflow: hidden; margin-bottom: 14px; }
.rail .link i { position: absolute; inset: 0; background: var(--ink); transform: scaleX(0); transform-origin: left; transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
.rail .link.on i { transform: scaleX(1); }

/* 첫 화면 */
.hero { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 84px 22px 36px; }
.hero-in { min-width: 0; width: min(620px, 100%); display: grid; grid-template-columns: minmax(0, 1fr); justify-items: stretch; gap: 10px; text-align: left; }
.date { font-size: 13px; color: var(--muted); margin: 0; }
.stat-row { display: flex; align-items: center; gap: 26px; margin: 18px 0 6px; }
@media (max-width: 420px) { .stat-row { gap: 18px; } }
.stats { display: grid; flex: 1; min-width: 0; }
.stats button { display: grid; gap: 1px; border: 0; background: none; padding: 9px 0; border-bottom: 1px solid var(--line); text-align: left; }
.stats button:last-child { border-bottom: 0; }
.stats button:hover b { color: var(--brand); }
.stats .k { font-size: 11.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.stats .k .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.stats .k2 { font-size: 11px; color: var(--muted); line-height: 1.2; }
.stats b { font-size: 18px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; transition: color .15s; }
.stats b.sm { font-size: 14px; font-weight: 500; }
.ringbox { position: relative; width: clamp(160px, 44vw, 220px); flex: none; aspect-ratio: 1; transition: transform .5s cubic-bezier(.2, .8, .2, 1), opacity .4s; }
.ringbox svg { width: 100%; height: 100%; display: block; overflow: visible; }
.ringbox.lift { transform: translateY(-38vh) scale(.14); opacity: 0; }
.ring-hit { fill: none; stroke: transparent; cursor: pointer; pointer-events: stroke; }
.ring-hit:hover + .ring-hl, .ring-hit:focus-visible + .ring-hl { opacity: .18; }
.ring-hl { fill: none; stroke: var(--ink); opacity: 0; pointer-events: none; transition: opacity .2s; }
.arc { fill: none; stroke-linecap: round; transition: stroke-dasharray 1.1s cubic-bezier(.2, .8, .2, 1), stroke-dashoffset 1.1s cubic-bezier(.2, .8, .2, 1); }
.ringbox svg .arc { filter: none; }
.center-link { pointer-events: auto; display: grid; justify-items: center; gap: 6px; border: 0; background: none; color: var(--ink); font-size: 15px; font-weight: 600; line-height: 1.3; padding: 18px 22px; border-radius: 50%; cursor: pointer; }
.center-link .cl-plus { width: 44px; height: 44px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-size: 28px; font-weight: 500; line-height: 1; box-shadow: 0 6px 18px color-mix(in srgb, var(--brand) 35%, transparent); transition: transform .15s; }
.center-link:hover .cl-plus { transform: scale(1.08); }
.center-link:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.center { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; pointer-events: none; gap: 1px; text-align: center; }
.center .lbl { font-size: 11px; color: var(--muted); white-space: nowrap; }
.center .big { font-size: clamp(17px, 4.6vw, 23px); font-weight: 700; letter-spacing: -.03em; line-height: 1.15; white-space: nowrap; transition: color .2s; }
.center .sm { font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.center .sm.up { color: var(--up); } .center .sm.down { color: var(--down); }
.ringbox[data-hover] .center .lbl { color: var(--brand); font-weight: 600; }
.ringbox[data-hover] .arc { opacity: .3; transition: opacity .15s; } .ringbox[data-hover] .arc[data-on] { opacity: 1; }
.center .big.up { color: var(--up); } .center .big.down { color: var(--down); }
.legend { display: none; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: -2px; }
.legend button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 80%, transparent); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
.legend button:hover { border-color: var(--ink); }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.legend b { font-weight: 600; font-variant-numeric: tabular-nums; }
.hero h1 { margin: 0; font-size: clamp(36px, 6vw, 48px); font-weight: 700; letter-spacing: -.045em; line-height: 1.1; }
.rot { height: 22px; overflow: hidden; color: var(--muted); font-size: 14.5px; margin-top: 2px; }
.rot span { display: block; animation: rot 10s infinite; }
@keyframes rot { 0%, 18% { transform: translateY(0); } 25%, 43% { transform: translateY(-22px); } 50%, 68% { transform: translateY(-44px); } 75%, 93% { transform: translateY(-66px); } 100% { transform: translateY(-88px); } }
.hero .about { border: 0; background: none; color: var(--muted); font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; padding: 0; }
.hero .fine { margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13.5px; }
.chip:hover { border-color: var(--brand); color: var(--brand); }
.hero .starter { display: grid; border-top: 1px solid var(--ink); margin-top: 14px; }
.hero .starter button { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 13px 2px; font-size: 15px; text-align: left; }
.hero .starter button:last-child { border-bottom: 0; }
.hero .starter button span:last-child { color: var(--silver); transition: transform .15s; }
.hero .starter button:hover span:last-child { color: var(--brand); transform: translateX(3px); }
.live { display: flex; gap: 4px 14px; flex-wrap: wrap; position: relative; margin-top: 2px; }
.live > button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--muted); font-size: 12.5px; padding: 4px 0; border-radius: 6px; }
.live > button b { color: var(--ink); font-weight: 600; }
.live > button:hover, .live > button[aria-expanded="true"] { color: var(--brand); }
.live .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.fine { font-size: 11.5px; color: var(--muted); margin: 0; }
.livecard { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; width: min(340px, 92vw); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 12px 14px; text-align: left; display: grid; gap: 4px; }
.livecard h4 { margin: 0 0 4px; font-size: 13px; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; }
.livecard h4 .on { color: var(--ok); font-weight: 600; }
.about-tabs { display: flex; gap: 6px; }
.about-tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.about-tabs button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.about-body { display: grid; gap: 10px; font-size: 14.5px; }
.about-body .step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.about-body .step i { width: 26px; height: 26px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 12px; }
.about-body .step b { display: block; }
.about-body .step span { color: var(--muted); font-size: 13.5px; }
.sheet.wide { width: min(560px, 100%); }
.present { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 35; width: min(720px, calc(100% - 28px)); background: var(--ink); color: var(--surface); border-radius: 16px; padding: 12px 14px 12px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; box-shadow: 0 16px 40px rgba(0, 0, 0, .3); }
.present .st { font-size: 11.5px; opacity: .7; }
.present .cap { font-size: 15px; font-weight: 500; line-height: 1.45; }
.present .ctl { display: flex; gap: 6px; }
.present .ctl button { border: 0; background: rgba(255, 255, 255, .14); color: inherit; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; }
.present .ctl button.go { background: var(--brand); color: var(--brand-ink); }
.hero .play { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 0; font-size: 12.5px; color: var(--muted); justify-self: start; }
.hero .play:hover { border-color: var(--brand); color: var(--brand); }
.livecard .r { display: grid; grid-template-columns: minmax(0, 1fr) auto 64px; gap: 10px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); font-size: 14px; }
.livecard .r:first-of-type { border-top: 0; }
.livecard .r b { font-weight: 700; text-align: right; transition: color .3s; }
.livecard .r span:last-child { text-align: right; font-size: 13px; }
.livecard .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.livecard .tags button { border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; }
.flash { animation: flash .6s; }
@keyframes flash { from { background: var(--warn-soft); } }

/* 질문창 */
.ask { width: 100%; position: relative; }
.pill { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 4px 4px 6px; box-shadow: 0 10px 34px rgba(22, 24, 28, .09); transition: border-color .15s, box-shadow .15s; }
.pill:hover { border-color: var(--silver); }
.pill:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft), 0 10px 34px rgba(22, 24, 28, .09); }
.pill input[type="text"] { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; padding: 9px 4px; }
.ib { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; }
.ib:hover { background: var(--sunk); }
.ib svg { width: 21px; height: 21px; }
.send { background: var(--brand); color: var(--brand-ink); }
.send:hover { background: var(--brand-deep); }
.lvl-btn { flex: none; display: inline-flex; align-items: center; gap: 3px; border: 0; background: none; border-radius: 999px; padding: 8px 9px; font-size: 13.5px; font-weight: 500; }
.lvl-btn:hover { background: var(--sunk); }
.lvl-btn svg { width: 14px; height: 14px; }
.menu { position: absolute; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 6px; min-width: 250px; text-align: left; }
.menu.up { bottom: calc(100% + 8px); } .menu.down { top: calc(100% + 8px); }
.menu.left { left: 0; } .menu.right { right: 0; }
.menu .it { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: center; border: 0; background: none; border-radius: 10px; padding: 9px 10px; text-align: left; font-size: 14px; }
.menu .it:hover, .menu .it[aria-checked="true"] { background: var(--sunk); }
.menu .it small { display: block; font-size: 12px; color: var(--muted); }
.menu .it .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-size: 13px; }
.menu .it[aria-checked="true"] .dot, .menu .it.hl .dot { background: var(--brand); color: var(--brand-ink); }

/* 안쪽 화면 */
.inside-wrap { width: min(780px, 100%); margin: 0 auto; padding: calc(80px + env(safe-area-inset-top, 0px)) 18px 180px; display: grid; gap: 26px; }
.panel { position: relative; }
.panel.slide-in-r { animation: inR .42s cubic-bezier(.2, .8, .2, 1); } .panel.slide-in-l { animation: inL .42s cubic-bezier(.2, .8, .2, 1); } .panel.grow { animation: grow .5s cubic-bezier(.2, .8, .2, 1); }
@keyframes inR { from { opacity: 0; transform: translateX(40px); } } @keyframes inL { from { opacity: 0; transform: translateX(-40px); } } @keyframes grow { from { opacity: 0; transform: scale(.92) translateY(-30px); } }
.ph { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 18px; align-items: center; margin-bottom: 16px; }
.ph svg { width: 112px; height: 112px; }
.ph .t { font-size: 13px; color: var(--muted); }
.ph .h { font-size: clamp(22px, 3.4vw, 28px); font-weight: 700; letter-spacing: -.02em; line-height: 1.25; margin: 2px 0 4px; }
.ph .s { font-size: 14px; color: var(--muted); }
@media (max-width: 480px) { .ph { grid-template-columns: 84px minmax(0, 1fr); gap: 14px; } .ph svg { width: 84px; height: 84px; } }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; padding: 12px max(14px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 78%, transparent); }
.dock .ask { width: min(780px, 100%); margin: 0 auto; }
.dock .fine { text-align: center; margin-top: 6px; }
.thread { display: grid; gap: 26px; }
.q { justify-self: end; max-width: 80%; background: var(--ink); color: var(--bg); border-radius: 18px 18px 4px 18px; padding: 9px 16px; font-size: 15px; font-weight: 500; scroll-margin-top: 90px; }
.a { display: grid; gap: 12px; }
.a-head { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; }
.a-head svg { width: 28px; height: 28px; margin-top: 3px; }
.thinking .a-head svg { animation: spin 1.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.headline { margin: 0; font-size: clamp(19px, 2.6vw, 22px); font-weight: 600; line-height: 1.4; letter-spacing: -.01em; }
.headline.wait { color: var(--muted); font-weight: 400; }
.labels { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.lb { font-size: 11.5px; font-weight: 600; border-radius: 6px; padding: 1px 8px; background: var(--sunk); color: var(--muted); }
.lb.live { background: var(--ok-soft); color: var(--ok); } .lb.op { background: var(--brand-soft); color: var(--brand); } .lb.warn { background: var(--warn-soft); color: var(--warn); } .lb.ok { background: var(--ok-soft); color: var(--ok); }
.body { margin-left: 42px; display: grid; gap: 12px; min-width: 0; }
@media (max-width: 560px) { .body { margin-left: 0; } }
.viz { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; min-width: 0; }
.viz svg { display: block; width: 100%; height: auto; }
.viz .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.viz .big { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.viz .sub, .sub { font-size: 13px; color: var(--muted); }

.keynote { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.keyin { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.keyin input { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px; }
.keyin input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
.keymsg { margin: 0; min-height: 1.2em; font-size: 13px; color: var(--brand); }

/* ══════════ v3 세련 레이어 ══════════ */
.qrbtn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
.qrbtn svg { width: 15px; height: 15px; } .qrbtn:hover { border-color: var(--brand); color: var(--brand); }
.qrs { justify-items: center; text-align: center; } .qrbox { width: 236px; height: 236px; display: grid; place-items: center; background: #fff; border-radius: 14px; padding: 8px; border: 1px solid var(--line); color: #555; font-size: 13px; }
.qrbox svg { width: 100%; height: 100%; display: block; }
.sheet.pbv { width: min(820px, 100%); max-height: 92vh; overflow: auto; gap: 12px; }
.pv-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; } .pv-top .btn { margin-left: auto; }
.pv-badge { background: var(--ink); color: var(--bg); font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 6px; }
.pv-lead { font-size: 14px; }
.pv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pv-c { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; background: var(--surface); display: grid; gap: 5px; align-content: start; }
.pv-c.wide { grid-column: 1 / -1; } .pv-c h4 { margin: 0 0 2px; font-size: 13px; color: var(--muted); font-weight: 600; }
.pv-r { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; } .pv-r span { color: var(--muted); }
.pv-q { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; } .pv-q li span { display: block; color: var(--muted); font-size: 12.5px; } .pv-q em { font-style: normal; color: var(--muted); font-size: 11.5px; }
.pv-n { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; color: var(--ink); }
.pv-open { background: var(--brand-soft); border-radius: 10px; padding: 9px 12px; margin-top: 4px; } .pv-open p { color: var(--ink); font-size: 14px; margin: 2px 0 0; }
.pv-ok { background: var(--ok-soft); border-color: transparent; } .pv-ok p { color: var(--ink); font-size: 13px; }
@media (max-width: 640px) { .pv-grid { grid-template-columns: 1fr; } .qrbtn span { display: none; } }

.sx { display: inline-grid; place-items: center; width: 1.15em; height: 1.15em; border-radius: .32em; background: color-mix(in srgb, var(--sx) 14%, transparent); color: var(--sx); margin-right: .35em; vertical-align: -.16em; flex: none; }
.sx svg { width: 78%; height: 78%; }
.cmn { display: inline-flex; align-items: center; min-width: 0; }
.tile .v .sx { width: 1em; height: 1em; }
.ck .sx { margin-right: 0; }

.say { margin: 8px 0 4px; padding: 10px 14px; background: var(--sunk); border-radius: 4px 16px 16px 16px; font-size: 14.5px; line-height: 1.65; color: var(--ink); max-width: 640px; }
.lb.guess { background: var(--sunk); color: var(--muted); }
#lvlName { display: inline-flex; align-items: center; gap: 4px; } #lvlName .le { font-size: 15px; }
@media (max-width: 480px) { #lvlName .lt { display: none; } .pbr .pbt { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; } }
.rot span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body { -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; }
.top { background: color-mix(in srgb, var(--bg) 78%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(16px); backdrop-filter: saturate(1.6) blur(16px); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.hero .date { display: inline-flex; justify-self: center; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; width: auto !important; }
.hero h1 { background: linear-gradient(180deg, var(--ink) 60%, color-mix(in srgb, var(--ink) 75%, var(--brand))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stats { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px 4px; box-shadow: 0 1px 0 rgba(22,24,28,.02), 0 8px 24px rgba(22,24,28,.05); }
.stats button { border-radius: 12px; transition: background .15s; }
.stats button:hover { background: var(--sunk); }
.stats b { font-size: 19px; font-weight: 700; letter-spacing: -.025em; }
.k2.gk { display: inline-flex; align-items: center; gap: 4px; }
.gi { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); flex: none; }
.gi svg { width: 62%; height: 62%; }
.gi.xs { width: 16px; height: 16px; border-radius: 4px; background: none; } .gi.xs svg { width: 100%; height: 100%; }
.gi.sm { width: 30px; height: 30px; border-radius: 9px; }
.gi.md { width: 38px; height: 38px; } .gi.lg { width: 58px; height: 58px; border-radius: 16px; }
.pbnote { width: min(560px, 100%); justify-self: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 12px 6px; text-align: left; box-shadow: 0 8px 24px rgba(22,24,28,.05); }
.pbh { display: flex; align-items: center; gap: 8px; padding: 0 4px 6px; }
.pbh b { font-size: 13.5px; } .pbh .sub { margin-left: auto; font-size: 12px; }
.pbdot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
.pbr { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) 14px; align-items: center; gap: 10px; border: 0; border-top: 1px solid var(--line); background: none; padding: 9px 4px; text-align: left; font-size: 14px; border-radius: 0; }
.pbr:hover { background: var(--sunk); } .pbr:hover .pba { color: var(--brand); transform: translateX(2px); }
.pbt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pba { color: var(--silver); font-size: 18px; transition: transform .15s; }
.pbi { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--sunk); color: var(--muted); }
.pbi svg { width: 17px; height: 17px; }
.pbi.warn { background: var(--warn-soft); color: var(--warn); } .pbi.cal, .pbi.goal { background: var(--brand-soft); color: var(--brand); } .pbi.coin { background: var(--ok-soft); color: var(--ok); }
.viz { box-shadow: 0 1px 0 rgba(22,24,28,.02), 0 8px 24px rgba(22,24,28,.04); }
.tile { transition: border-color .15s, transform .15s, box-shadow .15s; }
.tile:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(22,24,28,.08); }
.chip { transition: border-color .15s, color .15s, background .15s; } .chip:hover { border-color: var(--brand); color: var(--brand); }
/* 목표 물건 */
.gflow { display: grid; grid-template-columns: minmax(0,1fr) 64px minmax(0,1fr); align-items: stretch; gap: 8px; }
.gcard { display: grid; justify-items: center; text-align: center; gap: 4px; border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 10px; background: var(--sunk); }
.gcard.on { background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 30%, var(--line)); }
.gcard.on .gi { background: var(--surface); }
.gcard b { font-size: 14.5px; line-height: 1.3; } .gcard .gamt { font-size: 13px; font-weight: 700; color: var(--ink); }
.gics { display: flex; align-items: center; gap: 4px; margin: 2px 0; } .gics .plus { color: var(--muted); font-weight: 700; }
.gcard:not(.on) .gi { background: var(--surface); color: var(--silver); }
.garrow { display: grid; place-content: center; justify-items: center; gap: 2px; color: var(--brand); } .garrow svg { width: 40px; } .garrow span { font-size: 13px; font-weight: 700; }
.sl-ends { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin: -6px 0 4px; padding-left: 110px; }
.sett label.sl output { min-width: 46px; text-align: right; white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
ul.gl { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13.5px; }
.goal-bar i { background: linear-gradient(90deg, var(--brand-hi), var(--brand)); }
/* 주식 밖 */
.blist { display: grid; }
.brow { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.brow:first-child { border-top: 0; }
.bn, .bv { display: grid; gap: 1px; min-width: 0; } .bv { text-align: right; }
.bn b { font-size: 14px; } .bv b { font-size: 15.5px; } .brow .sub { font-size: 12px; }
/* 자산별 추이 */
.cks { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.ck { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px 5px 8px; font-size: 13px; cursor: pointer; user-select: none; transition: border-color .15s, background .15s; }
.ck input { position: absolute; opacity: 0; pointer-events: none; }
.ck i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; opacity: .35; }
.ck:has(input:checked) { border-color: var(--ink); background: var(--sunk); font-weight: 600; } .ck:has(input:checked) i { opacity: 1; }
.ck:has(input:focus-visible) { outline: 2px solid var(--brand); outline-offset: 2px; }
.ck.sm { font-size: 12.5px; color: var(--muted); } .ck.sm:has(input:checked) { color: var(--ink); }
.mc { position: relative; }
.mc-tip { position: absolute; top: 6px; z-index: 3; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; display: grid; gap: 3px; pointer-events: none; white-space: nowrap; }
.mc-tip i, .mr i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }
.mrows { display: grid; margin-top: 6px; }
.mr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.mr b small { font-weight: 600; font-size: 11.5px; margin-left: 2px; }
@media (max-width: 560px) { .mr { grid-template-columns: minmax(0,1fr) auto; } .mr .sub { display: none; } .gflow { grid-template-columns: minmax(0,1fr) 44px minmax(0,1fr); } .sl-ends { padding-left: 0; } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stats, :root:not([data-theme="light"]) .pbnote, :root:not([data-theme="light"]) .viz { box-shadow: none; } }

// 사내 서버(FastAPI)로 띄웠을 때: /api/ai 를 claude.use("sample")과 같은 모양으로 감쌈
function serverSample() {
  const b64 = (f) => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok({ media_type: f.type || "image/jpeg", data: String(r.result).split(",")[1] }); r.onerror = no; r.readAsDataURL(f); });
  const call = async (input, o = {}, json) => {
    const images = o.images ? await Promise.all([...(o.images.length != null ? o.images : [o.images])].map(b64)) : [];
    let r; try { r = await fetch("api/ai", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ input, json_mode: json, tier: o.modelTier || "default", images }), signal: o.signal }); }
    catch (e) { throw { code: e.name === "AbortError" ? "cancelled" : "upstream_error" }; }

  };

}

// ══════════ 내 API 키로 연결: GitHub Pages처럼 서버가 없는 주소에서도 브라우저가 Claude에 직접 물어봄 ══════════

    const last = msgs[msgs.length - 1];
    if (json) last.content += "\n\n답변은 JSON 값 하나로만 쓰세요. 다른 글은 쓰지 마세요.";
    if (o.images) last.content = [...(await Promise.all([...(o.images.length != null ? o.images : [o.images])].slice(0, 4).map(b64))), { type: "text", text: last.content }];

  };

}

  };

}

// ══════════ 실시간 가상 시세: 1초마다 일반 종목 ±0.1~0.2%, 변동성 큰 종목 ±0.6~1.4% ══════════
const VOL = (s) => (s.bucket === "bold" ? [0.6, 1.4] : [0.1, 0.2]);
const tickSize = (p) => (p < 2000 ? 1 : p < 5000 ? 5 : p < 20000 ? 10 : p < 50000 ? 50 : p < 200000 ? 100 : p < 500000 ? 500 : 1000);
const TICK = { base: null };
function stockTick() {
  if (document.hidden || demoI >= 0 && false) return;
  if (!TICK.base) { TICK.base = {}; [...STOCKS, ...PEERS].forEach((s) => { if (s.price) TICK.base[s.code] = { px0: s.price, prev: s.price / (1 + (s.chg || 0) / 100) }; }); }
  const before = {};
  [...STOCKS, ...PEERS].forEach((s) => {
    const b = TICK.base[s.code]; if (!b) return; before[s.code] = s.price;
    const [lo, hi] = VOL(s), mag = lo + Math.random() * (hi - lo), pull = (s.price / b.px0 - 1) * 100;
    const move = (Math.random() < 0.5 - Math.max(-0.25, Math.min(0.25, pull * 0.05)) ? 1 : -1) * mag;
    let np = Math.min(b.prev * 1.3, Math.max(b.prev * 0.7, s.price * (1 + move / 100)));
    const tk = tickSize(np), r = Math.round(np / tk) * tk;
    s.price = r === s.price ? s.price + (move > 0 ? tk : -tk) : r;
    s.chg = +((s.price / b.prev - 1) * 100).toFixed(2);
  });
  if (!document.body.classList.contains("inside")) paintStats();
  document.querySelectorAll("[data-px]").forEach((el) => {
    const s = findStock(el.dataset.px); if (!s || before[s.code] === s.price) return;
    el.textContent = won(s.price); el.classList.remove("fl-up", "fl-down"); void el.offsetWidth; el.classList.add(s.price > before[s.code] ? "fl-up" : "fl-down");
  });
  document.querySelectorAll("[data-clock]").forEach((el) => (el.textContent = hmsNow()));
}
// 첫 화면 오른쪽 숫자만 다시 그림 (링 애니메이션은 건드리지 않음)

  if (t.closest(".tagpop .x") || ($("pop") && !t.closest(".tagpop"))) closePop();
  const pf = t.closest("[data-pf]"); if (pf) { closeMenus(); usePf(pf.dataset.pf, current ? "" : "오늘 내 잔고 어때?"); return; }
  const ed = t.closest("[data-estate-del]"); if (ed) { const x = estate.splice(+ed.dataset.estateDel, 1)[0]; saveEstate(); $("panel").innerHTML = ringPanel("asset"); paintHome(); toast(`「${x.name}」을(를) 뺐어요`); return; }
  if (t.closest("#home")) { goHome(); return; }
  if (t.closest("#playBtn")) { book = null; linked = []; store.del("rings.holdings"); store.del("rings.linked"); demoI = -1; demoStep("next"); return; }
  const dm = t.closest("[data-demo]"); if (dm) { demoStep(dm.dataset.demo); return; }
  const ab = t.closest("[data-about]"); if (ab) { openAbout(ab.dataset.about); return; }
  const rg = t.closest("[data-ring]"); if (rg) { closeMenus(); liveOpen = null; openRing(rg.dataset.ring); return; }
  const lv = t.closest("[data-live]"); if (lv) { liveOpen = liveOpen === lv.dataset.live ? null : lv.dataset.live; paintLive(); return; }
  if (liveOpen && !t.closest("#live")) { liveOpen = null; paintLive(); }
  if (t.closest("#plusBtn")) { if (document.querySelector(".menu")) { closeMenus(); return; } openMenu(t.closest("#plusBtn"), `<button type="button" class="it hl" data-act="link"><span class="dot">⟳</span><span>내 자산 한 번에 연결<small>증권·은행·부동산 시세 (마이데이터)</small></span></button><button type="button" class="it" data-act="upload"><span class="dot">↑</span><span>잔고 사진 올리기<small>종목·수량·평균단가만 읽어요</small></span></button><button type="button" class="it" data-act="demo"><span class="dot">▶</span><span>예시 잔고로 해 보기<small>가상 종목 4개</small></span></button><button type="button" class="it" data-act="pfmenu"><span class="dot">◎</span><span>성향별 예시 잔고<small>안정형 · 균형형 · 공격형</small></span></button><button type="button" class="it" data-act="estate"><span class="dot">⌂</span><span>부동산 직접 넣기<small>집·오피스텔·상가 시세와 대출</small></span></button>${book || linked.length ? `<button type="button" class="it" data-act="reset"><span class="dot">×</span><span>연결 모두 해제<small>처음 상태로</small></span></button>` : ""}`); return; }
  if (t.closest("#lvlBtn")) { if (document.querySelector(".menu")) { closeMenus(); return; } openMenu(t.closest("#lvlBtn"), Object.entries(LEVELS).map(([k, l]) => `<button type="button" class="it" role="menuitemradio" aria-checked="${prefs.level === k}" data-level="${k}"><span class="dot">${prefs.level === k ? "✓" : ""}</span><span>${l.name}<small>${l.hint}</small></span></button>`).join("")); return; }
  const lvl = t.closest("[data-level]"); if (lvl) { prefs.level = lvl.dataset.level; savePrefs(); $("lvlName").innerHTML = lvlHtml(prefs.level); closeMenus(); toast(`${LEVELS[prefs.level].name} 수준으로 답할게요`); return; }
  const slv = t.closest("[data-lv]"); if (slv) { prefs.level = slv.dataset.lv; savePrefs(); $("lvlName").innerHTML = lvlHtml(prefs.level); const a = slv.closest(".a"); paint(a, a._a.redo()); return; }
  if (!t.closest(".menu")) closeMenus();
  const tile = t.closest("[data-tile]");
  if (tile) { const box = tile.closest(".body, .panel"), d = tile.closest(".tiles").nextElementSibling, open = tile.getAttribute("aria-expanded") === "true"; box.querySelectorAll("[data-tile]").forEach((b) => b.setAttribute("aria-expanded", "false")); if (open) { d.hidden = true; return; } tile.setAttribute("aria-expanded", "true"); d.innerHTML = tile.dataset.detail; d.hidden = false; d.scrollIntoView({ behavior: "smooth", block: "nearest" }); return; }
  const ak = t.closest("[data-ask]"); if (ak) { closePop(); liveOpen = null; paintLive(); ask(ak.dataset.ask); return; }
  const pr = t.closest("[data-preset]"); if (pr) { setPreset(pr.dataset.preset); $("panel").innerHTML = ringPanel("rule"); paintHome(); toast(`${PRESETS[pr.dataset.preset].name}으로 저장했어요`); return; }
  const act = t.closest("[data-act]"), a = act?.dataset.act;
  if (a === "link") { closeMenus(); linkSheet(act.dataset.then); return; }
  if (a === "dolink") { doLink(act.dataset.then); return; }
  if (a === "upload") { closeMenus(); $("file").click(); return; }
  if (a === "demo") { closeMenus(); useDemo(act.dataset.then || (document.body.classList.contains("inside") ? "오늘 내 잔고 어때?" : "")); return; }
  if (a === "reset") { closeMenus(); book = null; linked = []; estate = []; store.del("rings.estate"); store.del("rings.holdings"); store.del("rings.linked"); goHome(); toast("처음 상태로 돌아왔어요"); return; }
  if (a === "pb") { openPB(); return; }
  if (a === "pbview") { openPBView(); return; }
  if (a === "qr") { openQR(); return; }
  if (a === "aikey") { closeMenus(); openAiKey(); return; }
  if (a === "aikeysave") { saveAiKey(); return; }
  if (a === "aikeydel") { dropAiKey(); return; }
  if (a === "pfmenu") { openMenu($("plusBtn"), Object.entries(PF_NAME).map(([k, n]) => `<button type="button" class="it" data-pf="${k}"><span class="dot">${TYPE_ICON[k]}</span><span>${n} 예시 잔고<small>${SAMPLE_PF[k].holdings.length}종목 · 가상</small></span></button>`).join("")); return; }
  if (a === "estate") { closeMenus(); openEstate(); return; }
  if (a === "estsample") { ensureEstate(); $("panel").innerHTML = ringPanel("asset"); paintHome(); toast("예시 부동산을 넣었어요"); return; }
  if (t.closest("[data-close]") || t.id === "overlay") { $("overlay").hidden = true; return; }
  if (t.closest("[data-req]")) { toast("상담 요청을 보냈어요 (가상) · PB가 받은 화면을 보여 드릴게요"); openPBView(); return; }
  if (t.closest("[data-copyurl]")) { navigator.clipboard?.writeText(SHARE_URL).then(() => toast("주소를 복사했어요")).catch(() => toast("주소를 길게 눌러 복사해 주세요")); return; }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "aiKeyIn") { e.preventDefault(); saveAiKey(); return; }
  if (e.key === "Escape") { closePop(); closeMenus(); $("overlay").hidden = true; liveOpen = null; paintLive(); if (demoI >= 0) demoStep("stop"); }
  if (demoI >= 0 && !e.target.matches?.("input, textarea") && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { e.preventDefault(); demoStep(e.key === "ArrowRight" ? "next" : "prev"); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".ring-hit")) { e.preventDefault(); openRing(e.target.dataset.ring); }
});
document.addEventListener("input", (e) => { const t = e.target; if (t.dataset?.ratio && t.tagName === "INPUT") setRatio(t.dataset.ratio, +t.value); if (t.dataset?.pref) { prefs[t.dataset.pref] = Math.max(1, +t.value || 1); savePrefs(); }
  if (t.dataset?.goal) { // 끄는 동안 슬라이더는 그대로 두고 숫자와 판정만 바꿈
    const w0 = wealth(), g = { ...goalOf(w0), ...(prefs.goal || {}) }; if (t.dataset.goal === "amt") g.amount = goalSteps(w0.net / 1e4)[+t.value]; else { g.years = +t.value; if (!prefs.goal?.amount) g.amount = goalOf(w0).amount; } prefs.goal = { amount: g.amount, years: g.years }; savePrefs();
    const tmp = document.createElement("div"); tmp.innerHTML = goalBox(wealth()); $("goalVerdict").innerHTML = tmp.querySelector("#goalVerdict").innerHTML; $("goalWords").textContent = tmp.querySelector("#goalWords").textContent;
    t.nextElementSibling.textContent = t.dataset.goal === "amt" ? man(g.amount * 1e4) : `${g.years}년`; paintHome(); }
  if (t.id === "q") kwOpen(); });
document.addEventListener("change", (e) => { const t = e.target; if (t.dataset?.ser) { t.checked ? CHK.add(t.dataset.ser) : CHK.delete(t.dataset.ser); store.set("rings.chk", [...CHK]); $("mchart").innerHTML = mchart(); } });
document.addEventListener("mousemove", mchartHover); document.addEventListener("mouseout", (e) => { if (e.target.closest?.(".mc") && !e.relatedTarget?.closest?.(".mc")) mchartHover({ type: "mouseleave", target: e.target }); });
document.addEventListener("submit", (e) => { if (e.target.id === "estateForm") { e.preventDefault(); addEstate(); } });
$("askForm").addEventListener("submit", (e) => { e.preventDefault(); ask($("q").value); });
$("file").addEventListener("change", (e) => { const f = e.target.files[0]; if (f) analyze(f); e.target.value = ""; });
fetchLive();
(async () => {
  // 1) claude.ai에 게시한 화면이면 Claude 직접 연결  2) FastAPI 사내 서버로 띄우면 /api/ai  3) 둘 다 없으면 준비된 답만
  paintAiState();
  try { sample = window.claude?.use ? await window.claude.use("sample") : null; } catch { sample = null; }
  if (sample) AI_STATE.via = "claude";
  else if (location.protocol.startsWith("http")) { try { const r = await fetch("api/health"); if (r.ok && (await r.json()).ok) { sample = serverSample(); AI_STATE.via = "server"; } } catch {} }
  // 3) 서버가 없는 주소(GitHub Pages 등)에서는 페이지에 넣은 Gemini 키, 없으면 이 브라우저에 저장된 내 API 키로 연결
  if (!sample && GEMINI_KEY) { sample = geminiSample(GEMINI_KEY); AI_STATE.via = "gemini"; }
  if (!sample && store.get(AIKEY)) { try { sample = await keySample(store.get(AIKEY)); AI_STATE.via = "key"; } catch { sample = null; } }
  if (sample) { try { sampleImages = !!(await sample.limits()).images; } catch {} }
  paintAiState();
})();
</script>
</body>
</html>
