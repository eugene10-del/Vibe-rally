# Render(render.com) 배포 설정: 저장소를 연결하면 이 파일대로 웹 서비스가 만들어진다
services:
  - type: web
    name: eugene-rings
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # 값은 Render 화면에서 직접 입력 (파일에 적지 않음)
      - key: AI_PER_MINUTE
        value: "12"
      - key: AI_PER_DAY
        value: "2000"
